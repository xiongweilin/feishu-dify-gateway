services:
  feishu-dify-gateway:
    build:
      context: .
    image: feishu-dify-gateway:0.1.0
    container_name: feishu-dify-gateway
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:18082:8083"
    environment:
      GATEWAY_SECRETS_DIR: /run/secrets
      GATEWAY_STATE_DB: /var/lib/feishu-gateway/state.db
      GATEWAY_PUBLIC_PORT: "8083"
      DIFY_BASE_URL: http://docker-api-1:5001/v1
      DIFY_HEALTH_URL: http://docker-api-1:5001/health
      PROMETHEUS_BASE_URL: http://prometheus:9090
      FEISHU_WS_ENABLED: "true"
    volumes:
      - /srv/secrets/feishu-dify-gateway:/run/secrets:ro
      - /srv/data/feishu-dify-gateway:/var/lib/feishu-gateway
    networks:
      - shared-net
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8082/healthz', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  shared-net:
    external: true
